<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#7a2a1d"><meta name="color-scheme" content="light dark"><style>:root{
  --bg:#fbf6f1; --surface:#ffffff; --fg:#2b1814; --muted:#7b665e; --line:#eddfd5;
  --brand:#c2502a; --brand-2:#6a211c; --brand-soft:#fcebe2;
  --green:#18a957; --green-soft:#e8f8ef; --red:#e5484d; --red-soft:#fdecec;
  --amber:#e8a022; --amber-soft:#fff3df; --violet:#c98a2b; --violet-soft:#faf0dc; --teal:#14b8c4;
  --side-a:#6a211c; --side-b:#2a0e0b; --shadow:0 4px 18px rgba(90,30,15,.08);
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#140c0a; --surface:#221411; --fg:#f6ebe4; --muted:#b9a196; --line:#3a2520;
  --brand:#e8804d; --brand-soft:#3d2018; --green-soft:#10301f; --red-soft:#3a1618; --amber-soft:#3a2b0f; --violet-soft:#3a2b12;
  --side-a:#3a1410; --side-b:#1a0a07; --shadow:0 4px 18px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#140c0a; --surface:#221411; --fg:#f6ebe4; --muted:#b9a196; --line:#3a2520;
  --brand:#e8804d; --brand-soft:#3d2018; --green-soft:#10301f; --red-soft:#3a1618; --amber-soft:#3a2b0f; --violet-soft:#3a2b12;
  --side-a:#3a1410; --side-b:#1a0a07; --shadow:0 4px 18px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
svg{display:block}
.app{display:flex;height:100%;min-width:0}
/* sidebar */
.side{width:256px;flex:none;background:linear-gradient(180deg,var(--side-a),var(--side-b));color:#fff;display:flex;flex-direction:column;overflow-y:auto;z-index:30;transition:transform .25s}
.brand{display:flex;gap:10px;align-items:center;padding:18px 18px 14px}
.brand b{display:block;font-size:22px;font-weight:800;letter-spacing:-.3px;line-height:1.1}
.brand small{opacity:.8;font-size:12px}
.nav{padding:6px 0 18px}
.nav .grp{display:flex;width:100%;align-items:center;justify-content:space-between;margin-top:6px;padding:12px 22px;background:none;border:0;border-left:3px solid transparent;color:#fae2d4;font-size:12px;letter-spacing:.9px;font-weight:700;text-transform:uppercase;text-align:left}
.nav .grp:hover{background:rgba(255,255,255,.07)}
.nav .grp svg{width:16px;height:16px;transition:transform .2s}
.nav .grp[aria-expanded="true"] svg{transform:rotate(180deg)}
.nav .grp.has{color:#fff}
.nav .sub{padding-bottom:4px}
.nav .sub a{padding-left:34px}
.nav a{display:flex;gap:12px;align-items:center;padding:10px 22px;color:#fdf2ec;text-decoration:none;font-weight:500;font-size:14px;border-left:3px solid transparent}
.nav a svg{width:18px;height:18px;opacity:.9;flex:none}
.nav a:hover{background:rgba(255,255,255,.08)}
.nav a.on{background:#d0622e;font-weight:700;border-left-color:#fff;border-radius:0 10px 10px 0;margin-right:10px;padding-right:12px}
.scrim{display:none}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.top{display:flex;gap:14px;align-items:center;padding:12px max(20px,env(safe-area-inset-right,0px)) 12px 20px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;position:relative}
.icon-btn svg{width:20px;height:20px}
.burger{background:none;border:0}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:42px;min-width:0}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;border:0;background:none;outline:0;height:100%}
.kbd{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.spacer{flex:1}
.badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:10px;font-weight:700;width:17px;height:17px;border-radius:50%;display:grid;place-items:center}
.user{display:flex;gap:10px;align-items:center}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#c2502a,#14b8c4);color:#fff;display:grid;place-items:center;font-weight:800}
.user b{display:block;font-size:13px;line-height:1.2}.user small{color:var(--muted);font-size:12px}
.content{flex:1;overflow-y:auto;padding:18px max(20px,env(safe-area-inset-right,0px)) 28px 20px}
/* hero */
.hero{position:relative;border-radius:18px;overflow:hidden;min-height:220px;background:linear-gradient(110deg,#f9e7dc 0%,#f6d6c4 45%,#ebb696 100%);display:grid;grid-template-columns:1fr;box-shadow:var(--shadow)}
.hero svg.art{position:absolute;inset:0;width:100%;height:100%}
.welcome{position:relative;margin:16px;max-width:300px;background:rgba(255,255,255,.72);backdrop-filter:blur(6px);border-radius:16px;padding:16px 18px;color:#431c12;align-self:start}
.welcome b{display:block;font-size:14px}.welcome h1{margin:2px 0 6px;font-size:26px;font-weight:800;letter-spacing:-.4px;line-height:1.1}
.welcome p{margin:0;font-size:13px;color:#6e5b52}
.quote{margin-top:10px;background:rgba(255,255,255,.8);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600}
.pure{position:absolute;right:30%;top:18px;display:flex;gap:8px;align-items:center;color:#431c12;font-weight:800;font-size:16px;line-height:1.2}
/* stats */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:10px}.stat-group{margin-top:16px}.stat-group-title{display:flex;align-items:center;gap:9px;margin:0 0 10px;padding:0 2px;color:var(--fg);font-size:15px;font-weight:800;letter-spacing:-.2px}.stat-group-title .group-mark{width:8px;height:22px;border-radius:5px;background:var(--brand)}.stat-group-title small{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}.stats .stat{min-height:98px}
.stat{display:flex;gap:14px;align-items:center;border-radius:16px;padding:16px;border:1px solid var(--line);min-width:0}
.stat .ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;flex:none}
.stat .ic svg{width:26px;height:26px}
.stat small{color:var(--muted);font-size:13px;display:block}
.stat strong{font-size:24px;font-weight:800;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.stat em{display:block;font-style:normal;font-size:12px;font-weight:600}
.s-green{background:var(--green-soft)}.s-green .ic{background:var(--green);color:#fff}.s-green em{color:var(--green)}
.s-red{background:var(--red-soft)}.s-red .ic{background:#fff;color:var(--red)}.s-red em{color:var(--green)}
.s-amber{background:var(--amber-soft)}.s-amber .ic{background:#fff;color:var(--amber)}.s-amber em{color:var(--red)}
.s-blue{background:var(--brand-soft)}.s-blue .ic{background:#fff;color:var(--brand)}.s-blue em{color:var(--green)}
/* cards grid */
.grid3{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;margin-top:14px;align-items:stretch}.grid3>.card{min-width:0}.grid3>.card:nth-child(3){grid-column:1/-1}.grid3 .donut{display:flex;align-items:center;justify-content:center;gap:22px;min-height:210px}.grid3 .act{min-height:0}.grid3>.card:nth-child(3) .act{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px}.chart{overflow:hidden}.chart svg{display:block;width:100%;max-height:240px;overflow:hidden}
.grid3b{display:grid;grid-template-columns:1fr 1fr 1.1fr;gap:14px;margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0;font-size:16px;font-weight:700}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.link{color:var(--brand);font-size:12.5px;font-weight:600;text-decoration:none;background:none;border:0;padding:0}
.sel{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font-size:13px}
.legend{display:flex;gap:14px;justify-content:flex-end;font-size:12px;color:var(--muted);margin-bottom:4px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.chart svg{width:100%;height:auto}
.donut{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.donut svg{width:170px;height:170px;flex:none;margin:0 auto}
.dl{flex:1;min-width:150px;display:grid;gap:10px;font-size:13px}
.dl div{display:flex;align-items:center;gap:8px}.dl i{width:9px;height:9px;border-radius:50%;flex:none}.dl span{flex:1;color:var(--muted)}
.act{display:grid;gap:12px}
.act li,.low li,.del li{list-style:none}
ul{margin:0;padding:0}
.act li{display:flex;gap:12px;align-items:center}
.act .dot{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none}
.act .dot svg{width:19px;height:19px}
.act b{display:block;font-size:13px}.act small{color:var(--muted);font-size:12px}.act time{margin-left:auto;color:var(--muted);font-size:11.5px;white-space:nowrap}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qa button{display:flex;gap:10px;align-items:center;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:13.5px;text-align:left}
.qa svg{width:20px;height:20px;flex:none}
.q-blue{background:var(--brand);color:#fff;box-shadow:0 6px 14px rgba(216,83,35,.35)}
.q-lb{background:var(--brand-soft);color:var(--brand)}.q-g{background:var(--green-soft);color:var(--green)}
.q-o{background:var(--amber-soft);color:#d98200}.q-r{background:var(--red-soft);color:var(--red)}.q-v{background:var(--violet-soft);color:var(--violet)}
.low,.del{display:grid;gap:12px}
.low li{display:flex;gap:12px;align-items:center}
.low .ico{width:34px;height:34px;border-radius:9px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.low .ico svg{width:18px;height:18px}
.low .t{flex:1;min-width:0}.low b{font-size:13px;display:block}.low small{color:var(--muted);font-size:12px}
.bar{flex:1;max-width:110px;height:6px;border-radius:6px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%}
.pill{font-size:12px;font-weight:700;padding:4px 12px;border-radius:8px;white-space:nowrap;display:inline-block}
.p-red{background:var(--red-soft);color:var(--red)}.p-amber{background:var(--amber-soft);color:#d98200}
.p-green{background:var(--green-soft);color:var(--green)}.p-blue{background:var(--brand-soft);color:var(--brand)}.p-gray{background:var(--bg);color:var(--muted)}
.del li{display:flex;gap:12px;align-items:center}
.del .tr{width:44px;flex:none;color:var(--brand)}.del .t{flex:1;min-width:0}.del b{font-size:13px;display:block}.del small{color:var(--muted);font-size:12px}
.foot{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px;padding:16px;border-radius:16px;background:linear-gradient(90deg,var(--brand-soft),var(--surface))}
.foot div{display:flex;gap:10px;align-items:center}.foot svg{width:30px;height:30px;flex:none}
.foot b{font-size:13.5px;color:var(--brand);display:block}.foot small{color:var(--muted);font-size:12px}
/* generic pages */
.ph{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ph h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.3px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;background:var(--brand);color:#fff;font-size:13.5px}
.btn.alt{background:var(--brand-soft);color:var(--brand)}
.btn.sm{padding:6px 10px;font-size:12px}.btn.danger{background:var(--red-soft);color:var(--red)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
.fld label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.fld input,.fld select{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--bg)}
.tw{overflow-x:auto;margin-top:14px}
table{border-collapse:collapse;width:100%;min-width:560px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);font-size:13.5px;font-variant-numeric:tabular-nums}
.empty{padding:28px;text-align:center;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}.kpi small{color:var(--muted);display:block}.kpi b{font-size:21px;font-weight:800}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:600;z-index:60}
/* responsive */
@media (max-width:1280px){.grid3{grid-template-columns:1fr 1fr}.grid3 .card:first-child{grid-column:1/-1}.grid3b{grid-template-columns:1fr 1fr}.grid3b .card:last-child{grid-column:1/-1}.pure{display:none}}
@media (max-width:900px){
  .side{position:fixed;inset:0 auto 0 0;transform:translateX(-100%);padding-top:env(safe-area-inset-top,0px)}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(37,14,8,.5);z-index:20}
  .stats{grid-template-columns:1fr 1fr}.foot{grid-template-columns:1fr 1fr}
  .kbd,.user div{display:none}
}
@media (min-width:901px){.burger{display:none}}
@media (max-width:640px){
  .spacer{display:none}
  .top{padding-left:12px;gap:10px}.content{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
  .grid3,.grid3b{grid-template-columns:1fr}.stats{gap:10px}.stat{padding:12px;gap:10px}.stat .ic{width:42px;height:42px}.stat strong{font-size:19px}
  .welcome{max-width:none;margin:12px}.hero{min-height:190px}.hero svg.art{opacity:.55}
  .foot{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

 .upi-qr-card{margin-top:14px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);display:grid;grid-template-columns:minmax(170px,230px) 1fr;gap:18px;align-items:center}
